name: Build and Test

# Nothing verified `main` until a release tag was pushed, which meant a broken
# build could sit on the branch for days. This runs on every push and PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Local Packages
        run: |
          # SwiftMath is a local package reference, not a submodule.
          mkdir -p Packages
          rm -rf Packages/SwiftMath
          git clone --depth 1 --branch 1.7.3 https://github.com/mgriebling/SwiftMath.git Packages/SwiftMath

      - name: Generate Xcode Project
        run: python3 scripts/generate_xcodeproj.py

      # The project file is generated from the source tree, so a stale checked-in
      # copy is a real failure: it means someone added a file without rerunning
      # the generator, and Xcode would not build that file.
      - name: Check the committed project file is up to date
        run: |
          if ! git diff --quiet -- Cauchy.xcodeproj; then
            echo "::error::Cauchy.xcodeproj is out of date. Run scripts/generate_xcodeproj.py and commit the result."
            git diff --stat -- Cauchy.xcodeproj
            exit 1
          fi

      # Compiles the app and the test bundle. This is the step that catches
      # tests rotting against the code they cover — which is exactly how five
      # of them ended up months out of date while nothing compiled them.
      - name: Build app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Cauchy.xcodeproj \
            -scheme Cauchy \
            -configuration Debug \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      # The tests are app-hosted. They run when the runner is at least the
      # deployment target (macOS 15). The xcode-27 image can compile against
      # the macOS 27 SDK and launch a macOS 15 binary.
      - name: Run tests
        run: |
          set -o pipefail
          runner_major=$(sw_vers -productVersion | cut -d. -f1)
          target_major=$(awk -F'= *' '/MACOSX_DEPLOYMENT_TARGET/ {print $2; exit}' scripts/generate_xcodeproj.py | cut -d. -f1)
          if [ "$runner_major" -lt "$target_major" ]; then
            echo "::notice::Runner is on macOS $(sw_vers -productVersion); the app requires macOS ${target_major}.0, so the tests cannot be launched here. They were compiled by the previous step. Run them locally with: xcodebuild test -project Cauchy.xcodeproj -scheme Cauchy -destination 'platform=macOS'"
            exit 0
          fi
          xcodebuild test-without-building \
            -project Cauchy.xcodeproj \
            -scheme Cauchy \
            -configuration Debug \
            -destination 'platform=macOS'
